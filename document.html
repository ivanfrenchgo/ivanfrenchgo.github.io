<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Document · Ivan French</title>
<style>
:root{--paper:#faf9f6;--ink:#1b1f24;--muted:#5f6a72;--rule:#e3e2da;--accent:#2f6f66}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1.25rem;border-bottom:1px solid var(--rule)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.actions{display:flex;gap:1rem;font-size:.9rem}
iframe{width:100%;flex:1;border:0;background:white}
.message{max-width:42rem;margin:4rem auto;padding:0 1.5rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <a href="/#work">← Back to Work &amp; Research</a>
  <div class="actions"><a id="open-file" href="#" target="_blank" rel="noopener noreferrer" hidden>Open or download PDF</a></div>
</header>
<iframe id="pdf-frame" title="PDF document" hidden></iframe>
<p id="message" class="message">Loading document…</p>
<script>
const issue = new URLSearchParams(location.search).get('issue');
const frame = document.getElementById('pdf-frame');
const openFile = document.getElementById('open-file');
const message = document.getElementById('message');

async function loadDocument() {
  if (!/^\d+$/.test(issue || '')) throw new Error('Invalid publication');
  const response = await fetch('https://api.github.com/repos/ivanfrenchgo/ivanfrenchgo.github.io/issues/' + issue, {
    headers: { Accept: 'application/vnd.github+json' }
  });
  if (!response.ok) throw new Error('Publication unavailable');
  const data = await response.json();
  const body = data.body || '';
  const documentSection = body.match(/### Document\s*\n+([\s\S]*?)(?=\n### |$)/i);
  const searchText = documentSection ? documentSection[1] + '\n' + body : body;
  const links = [...searchText.matchAll(/\[[^\]]+\]\((https:\/\/[^)]+\.pdf(?:\?[^)]*)?)\)/gi)];
  const attachment = links.map(match => match[1]).find(value => {
    try {
      const url = new URL(value);
      return url.protocol === 'https:' &&
        ((url.hostname === 'github.com' && url.pathname.startsWith('/user-attachments/')) ||
         url.origin === location.origin);
    } catch {
      return false;
    }
  });
  if (!attachment) throw new Error('No PDF attached');
  frame.src = attachment;
  openFile.href = attachment;
  frame.hidden = false;
  openFile.hidden = false;
  message.hidden = true;
}

loadDocument().catch(() => {
  frame.hidden = true;
  openFile.hidden = true;
  message.hidden = false;
  message.textContent = 'The PDF could not be found. Edit the publication and upload the PDF again in the Document field.';
});
</script>
</body>
</html>
